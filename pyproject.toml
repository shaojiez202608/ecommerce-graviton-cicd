[project]
name = "ecommerce-graviton-cicd"
version = "0.1.0"
description = "Graviton-first test environment, CI/CD and MCF fulfillment bridge for an open-source PHP storefront on AWS (prototype)"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.40", "moto[dynamodb,sqs,events,secretsmanager,cloudwatch]>=5.0"]
infra = ["aws-cdk-lib>=2.273.0", "constructs>=10.4", "cdk-nag>=3.0"]

[tool.uv]
package = false
default-groups = ["dev", "infra"]

[tool.pytest.ini_options]
pythonpath = ["src/mcf", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S603", "S607"]
