# Runs as the unprivileged www-data user on port 8080; uses Magento's own nginx.conf.sample.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # The ALB terminates client connections; trust X-Forwarded-Proto from it only.
    map $http_x_forwarded_proto $fastcgi_https { default ""; https on; }
    upstream fastcgi_backend { server 127.0.0.1:9000; }
    server {
        listen 8080;
        set $MAGE_ROOT /var/www/magento;
        set $MAGE_MODE production;
        fastcgi_param HTTPS $fastcgi_https;
        include /var/www/magento/nginx.conf.sample;
    }
}
