# Checks only; nothing is deployed and no AWS credentials are used.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read # checkout only; no tokens, no AWS credentials
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Lint, test, synth with cdk-nag, secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Unit tests and CDK assertions
        run: make test
      - name: Synth both profiles with cdk-nag
        run: make synth
      - name: Secret scan (full history) and canary
        run: make scan
